name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CPU-only torch keeps the install small; no GPU is used anywhere.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      # No presets ship with the repo, so the real-preset integration tests
      # skip here; they run locally against your own library.
      - run: pytest -ra
